name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

# PH-4: deterministic CI gate. The live benchmark (135 scenarios) and the
# live tool/matrix tests need the NIM endpoint + registered mock servers +
# seeded DB — they run in the nightly job / on-demand, never on PRs.

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nexus-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check src
      - name: Type check (mypy strict)
        run: uv run mypy src/nexus
      - name: Security scan (bandit)
        run: uv run bandit -r src/nexus -x tests,alembic,.venv -s B101,B311 -q
      - name: Deterministic unit tests (live tests excluded)
        run: uv run pytest -q --no-cov -m "not live"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: nexus-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Sync dependencies
        run: uv sync --frozen
      - name: 135-scenario benchmark (needs live NIM + seeded DB + mock servers)
        run: |
          echo "Wire the NIM endpoint / seeded registry / mock servers, then:"
          echo "uv run python scripts/run_benchmark.py --out benchmarks/run_latest.json"
        shell: bash
