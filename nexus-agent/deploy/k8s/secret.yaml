apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
type: Opaque
stringData:
  # REQUIRED — the operator MUST replace CHANGE_ME before deploying.
  # The API refuses to boot with auth.mode=none when NEXUS_ENV=production.
  NEXUS_DATABASE__URL: "postgresql+asyncpg://nexus:CHANGE_ME@postgres:5432/nexus"
  NEXUS_REDIS__URL: "redis://redis:6379/0"
  # REQUIRED for the NIM provider (see ConfigMap NEXUS_LLM__PROVIDERS):
  # NVIDIA_NIM_API_KEY: "<nvidia-nim-api-key>"
  # REQUIRED when NEXUS_AUTH__MODE=api_key:
  # NEXUS_AUTH__API_KEY: "<api-key>"
  # NEXUS_OBSERVABILITY__LANGSMITH_API_KEY: "lsv2_..."
